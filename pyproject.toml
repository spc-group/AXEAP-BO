[project]
name = "axeap-bo"
version = "0.1.1"
description = "KB XES analysis using Bayesian Optimization"
authors = [
    {name = "apsranjan",email = "ranjan@anl.gov"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=1.26.0,<2.0.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "scikit-optimize (>=0.10.2,<0.11.0)",
    "pandas (>=2.0.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
